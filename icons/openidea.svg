<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100" role="img" aria-label="OpenIDEA">
  <!-- macOS icon grid: 824px body on a 1024px canvas, the rest is room for the shadow. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4673A"/>
      <stop offset="1" stop-color="#C94F25"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232121"/>
      <stop offset="1" stop-color="#161515"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="9.8" y="9.8" width="80.4" height="80.4" rx="18" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="17" y="17" width="66" height="57" rx="11" fill="url(#screen)"/>
  <g transform="translate(50 45.5) scale(1.4) translate(-49.25 -44.55)" fill="#EAE7E0">
    <circle cx="44" cy="47.4" r="4.1" fill="none" stroke="#EAE7E0" stroke-width="2.7"/>
    <rect x="54.3" y="42" width="2.8" height="10.5"/>
    <rect x="51.2" y="42" width="5.9" height="2.5"/>
    <rect x="51.2" y="50" width="9.4" height="2.5"/>
    <circle cx="55.7" cy="38.4" r="1.8"/>
  </g>
</svg>
