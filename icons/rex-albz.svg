<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100" role="img" aria-label="Rex ALBZ">
  <!-- macOS icon grid: 824px body on a 1024px canvas, the rest is room for the shadow. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C22"/>
      <stop offset="1" stop-color="#08080B"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5B7CFF"/>
      <stop offset="0.35" stop-color="#B05CFF"/>
      <stop offset="0.65" stop-color="#FF4F9A"/>
      <stop offset="1" stop-color="#FFA23A"/>
    </linearGradient>
    <linearGradient id="rexfill" gradientUnits="userSpaceOnUse" x1="30" y1="70" x2="80" y2="18">
      <stop offset="0" stop-color="#C7B8FF"/>
      <stop offset="0.5" stop-color="#FFC6E0"/>
      <stop offset="1" stop-color="#FFE2C2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF4F9A" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#B05CFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#B05CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="9.8" y="9.8" width="80.4" height="80.4" rx="18"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="9.8" y="9.8" width="80.4" height="80.4" rx="18" fill="url(#body)" filter="url(#shadow)"/>

  <g clip-path="url(#squircle)">
    <ellipse cx="54" cy="44" rx="40" ry="36" fill="url(#glow)"/>

    <!-- Rex: head bowl on the right, neck stem on the left, scalloped crest on the back. -->
    <g fill="url(#rexfill)">
      <path d="M33 70 L33 42 C33 27 43 18 56 18 C70 18 81 26 81 37 C81 47 73 51 64 52 C61 52.5 61 55 64 56 L66 70 Z"/>
      <circle cx="41.0" cy="22.4" r="2.9"/>
      <circle cx="36.8" cy="26.6" r="2.9"/>
      <circle cx="34.4" cy="32.0" r="2.9"/>
      <circle cx="33.4" cy="37.8" r="2.9"/>
      <circle cx="33.1" cy="43.6" r="2.9"/>
      <circle cx="33.0" cy="49.4" r="2.9"/>
      <circle cx="33.0" cy="55.2" r="2.9"/>
      <circle cx="33.0" cy="61.0" r="2.9"/>
      <circle cx="33.0" cy="66.8" r="2.9"/>
    </g>
    <ellipse cx="43.5" cy="48.5" rx="2.6" ry="3.7" fill="#0B0B10"/>
    <path d="M51 61 Q57 62.6 63.5 59.6" fill="none" stroke="#0B0B10" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Name badge, in place of the original BETA pill. -->
    <rect x="25" y="65" width="50" height="16" rx="8" fill="#101016" stroke="url(#neon)" stroke-width="1.2"/>
    <text x="50" y="77.4" text-anchor="middle" font-family="SF Pro Rounded, SF Pro Display, -apple-system, Helvetica Neue, sans-serif" font-weight="800" font-size="11.5" letter-spacing="1.2" fill="url(#neon)">ALBZ</text>
  </g>

  <rect x="9.8" y="9.8" width="80.4" height="80.4" rx="18" fill="none" stroke="url(#neon)" stroke-width="0.5" stroke-opacity="0.55"/>
</svg>
